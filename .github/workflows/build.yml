name: Build APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Alias python3.14
        run: |
          if ! command -v python3.14 >/dev/null; then
            sudo ln -sf "$(command -v python3)" /usr/local/bin/python3.14
          fi
          python3.14 --version

      - name: Android SDK packages
        run: |
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          fi
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Rust + cargo-ndk
        run: |
          rustup target add aarch64-linux-android
          cargo install cargo-ndk --locked

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: native

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Bibliothèque Rust JNI
        run: |
          echo "NDK détecté : ${ANDROID_NDK_ROOT:-$ANDROID_NDK_HOME}"
          cd native
          cargo test
          cargo ndk -t arm64-v8a -o ../app/src/main/jniLibs build --release

      - name: Build APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Vérification de l'APK
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          ls -lh "$APK"
          sha256sum "$APK"
          AAPT=$(ls "$ANDROID_HOME"/build-tools/35.0.0/aapt2 | head -1)
          "$AAPT" dump badging "$APK" | head -3
          echo "--- bibliothèques natives ---"
          unzip -l "$APK" | grep -E "lib/.*\.so" || true

      - name: Upload APK (debug)
        uses: actions/upload-artifact@v4
        with:
          name: FRIDAY-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Décode le keystore
        if: env.KEYSTORE_BASE64 != ''
        run: |
          mkdir -p "$RUNNER_TEMP/keystore"
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/keystore/release.jks"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/keystore/release.jks" >> "$GITHUB_ENV"
          ls -lh "$RUNNER_TEMP/keystore/release.jks"

      - name: Build APK release signé
        if: env.KEYSTORE_BASE64 != ''
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle --no-daemon :app:assembleRelease

      - name: Vérification de l'APK release
        if: env.KEYSTORE_BASE64 != ''
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          ls -lh "$APK"
          sha256sum "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$APK"
          echo "--- debuggable ---"
          if "$ANDROID_HOME/build-tools/35.0.0/aapt2" dump badging "$APK" | grep -q "application-debuggable"; then
            echo "ERREUR : APK encore debuggable"; exit 1
          else
            echo "OK : APK non debuggable"
          fi

      - name: Upload APK (release)
        if: env.KEYSTORE_BASE64 != ''
        uses: actions/upload-artifact@v4
        with:
          name: FRIDAY-release-signed-apk
          path: app/build/outputs/apk/release/app-release.apk

      - name: Publier la Release (tag v*)
        if: startsWith(github.ref, 'refs/tags/v') && env.KEYSTORE_BASE64 != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$APK" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$APK" \
              --title "F.R.I.D.A.Y. $GITHUB_REF_NAME" \
              --notes "APK **release signé** (keystore dédié, \`debuggable=false\`)."
          fi
