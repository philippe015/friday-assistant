name: Tests

on:
  pull_request:
  push:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - 'docs/**'

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Alias python3.14
        run: |
          if ! command -v python3.14 >/dev/null; then
            sudo ln -sf "$(command -v python3)" /usr/local/bin/python3.14
          fi
          python3.14 --version

      - name: Rust
        run: rustup target add aarch64-linux-android

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: native

      - name: Tests Java / Python / Rust / JS
        run: bash scripts/tester_sources.sh
