name: Publish validated FRIDAY microphone hotfix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-micro-vosk-hotfix.yml'

permissions:
  contents: write
  actions: read

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4

      - name: Verify validated microphone repair
        run: |
          set -euo pipefail
          grep -Fq "versionName '3.13.3'" app/build.gradle
          grep -Fq 'Télécharger et activer' app/src/main/java/fr/friday/assistant/MainActivity.java
          grep -Fq 'wakeOnlyUntil = bargePendingUntil' app/src/main/java/fr/friday/assistant/FridayService.java

      - name: Find successful signed APK from current commit
        id: signed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          RUN_ID=""
          for attempt in $(seq 1 48); do
            RUN_ID="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow "Build APK" \
              --commit "$GITHUB_SHA" --limit 30 \
              --json databaseId,conclusion \
              --jq '[.[] | select(.conclusion == "success") | .databaseId][0] // empty')"
            if [ -n "$RUN_ID" ]; then break; fi
            sleep 10
          done
          if [ -z "$RUN_ID" ]; then
            echo "No successful signed APK build for $GITHUB_SHA"
            exit 1
          fi
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"

      - name: Download release APK signed by existing project key
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p dist
          gh run download "${{ steps.signed.outputs.run_id }}" \
            --repo "$GITHUB_REPOSITORY" --name FRIDAY-release-signed-apk --dir dist
          test -s dist/app-release.apk
          unzip -tq dist/app-release.apk
          mv dist/app-release.apk dist/FRIDAY-v3.13.3-micro-vosk-fix-release.apk
          sha256sum dist/FRIDAY-v3.13.3-micro-vosk-fix-release.apk

      - name: Publish signed APK as separate corrective release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG='v3.13.3-micro-vosk-fix'
          ASSET='dist/FRIDAY-v3.13.3-micro-vosk-fix-release.apk'
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release already exists; refusing to overwrite an existing signed artifact"
            exit 1
          fi
          gh release create "$TAG" "$ASSET" \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "FRIDAY Jarvis v3.13.3 — Micro et Vosk corrigés" \
            --notes "Correctif du microphone validé sur téléphone. Installation guidée du modèle Vosk français si absent, reprise de l'écoute, mot d'activation Friday/Jarvis, diagnostic Vosk, recherche Internet multi-sources. IA locale Jarvis uniquement ; aucune API Mistral. APK de production signé avec la clé configurée dans GitHub Actions. Le code versionName/versionCode reste 3.13.3/88 afin de conserver la compatibilité de ce correctif ; cette publication comporte un tag distinct de la version 3.13.3 précédente. L'application release utilise le package fr.friday.assistant ; l'APK debug de test utilise fr.friday.assistant.smartpreview. Les données privées ne sont pas intégrées à l'APK."
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json url,assets
