name: Publish FRIDAY v3.12.0

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-v3.12.0.yml'

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact release commit
        uses: actions/checkout@v4

      - name: Confirm version
        run: |
          set -euo pipefail
          grep -Fq "versionCode 78" app/build.gradle
          grep -Fq "versionName '3.12.0'" app/build.gradle

      - name: Find successful signed APK build for this commit
        id: signed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          RUN_ID=""
          for attempt in $(seq 1 36); do
            RUN_ID="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow "Build APK" \
              --commit "$GITHUB_SHA" --limit 30 \
              --json databaseId,conclusion \
              --jq '[.[] | select(.conclusion == "success") | .databaseId][0] // empty')"
            if [ -n "$RUN_ID" ]; then break; fi
            sleep 10
          done
          if [ -z "$RUN_ID" ]; then
            echo "No successful APK build for commit $GITHUB_SHA"
            exit 1
          fi
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"

      - name: Retrieve signed APK artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run download "${{ steps.signed.outputs.run_id }}" --repo "$GITHUB_REPOSITORY" \
            --name FRIDAY-release-signed-apk --dir dist
          test -s dist/app-release.apk
          unzip -tq dist/app-release.apk
          mv dist/app-release.apk dist/FRIDAY-v3.12.0-release.apk
          sha256sum dist/FRIDAY-v3.12.0-release.apk

      - name: Create exact version tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if ! gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v3.12.0" >/dev/null 2>&1; then
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
              -f ref='refs/tags/v3.12.0' -f sha="$GITHUB_SHA"
          fi

      - name: Publish signed Android release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view v3.12.0 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload v3.12.0 dist/FRIDAY-v3.12.0-release.apk \
              --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create v3.12.0 dist/FRIDAY-v3.12.0-release.apk \
              --repo "$GITHUB_REPOSITORY" --verify-tag \
              --title "F.R.I.D.A.Y. v3.12.0 - Jarvis local, Mistral et microphone Bluetooth Android" \
              --notes "FRIDAY v3.12.0 : deux moteurs uniquement (Jarvis sur le telephone et Mistral Internet), connexion OpenJarvis PC supprimee de l'interface et du routage. Selection du microphone d'un casque Bluetooth SCO/HFP ou BLE Audio avec permission Android Appareils a proximite et repli automatique sur le microphone du telephone. Diagnostic du microphone reel, mode vocal continu et reprise apres coupure Android. APK release signe pour mise a jour directe depuis v3.11.2. La compatibilite doit etre validee avec un casque physique."
          fi
          gh release view v3.12.0 --repo "$GITHUB_REPOSITORY" --json url,assets
