name: Publish FRIDAY v3.12.3

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-v3.12.3.yml'

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact release commit
        uses: actions/checkout@v4

      - name: Confirm version
        run: |
          set -euo pipefail
          grep -Fq "versionCode 81" app/build.gradle
          grep -Fq "versionName '3.12.3'" app/build.gradle

      - name: Find successful signed APK build for this commit
        id: signed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          RUN_ID=""
          for attempt in $(seq 1 36); do
            RUN_ID="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow "Build APK" \
              --commit "$GITHUB_SHA" --limit 30 \
              --json databaseId,conclusion \
              --jq '[.[] | select(.conclusion == "success") | .databaseId][0] // empty')"
            if [ -n "$RUN_ID" ]; then break; fi
            sleep 10
          done
          if [ -z "$RUN_ID" ]; then
            echo "No successful APK build for commit $GITHUB_SHA"
            exit 1
          fi
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"

      - name: Retrieve signed APK artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run download "${{ steps.signed.outputs.run_id }}" --repo "$GITHUB_REPOSITORY" \
            --name FRIDAY-release-signed-apk --dir dist
          test -s dist/app-release.apk
          unzip -tq dist/app-release.apk
          mv dist/app-release.apk dist/FRIDAY-v3.12.3-release.apk
          sha256sum dist/FRIDAY-v3.12.3-release.apk

      - name: Create exact version tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if ! gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v3.12.3" >/dev/null 2>&1; then
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
              -f ref='refs/tags/v3.12.3' -f sha="$GITHUB_SHA"
          fi

      - name: Publish signed Android release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view v3.12.3 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload v3.12.3 dist/FRIDAY-v3.12.3-release.apk \
              --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create v3.12.3 dist/FRIDAY-v3.12.3-release.apk \
              --repo "$GITHUB_REPOSITORY" --verify-tag \
              --title "F.R.I.D.A.Y. v3.12.3 - Saisie ecrite independante et stabilite Bluetooth" \
              --notes "FRIDAY v3.12.3 : les questions ecrites passent directement par Jarvis local ou Mistral, sans microphone, Vosk ni Bluetooth. Les erreurs sont distinguees par moteur et affichees dans les reglages, les reponses dans la conversation et le diagnostic. Le profil mains libres HFP/SCO est reconnecte avant chaque nouvelle capture ; la sortie n'est abandonnee qu'apres trois constats de mauvais routage. Le stockage personnel chiffre reste local. APK signe compile par GitHub Actions. Le micro Bluetooth doit etre valide sur un casque reel."
          fi
          gh release view v3.12.3 --repo "$GITHUB_REPOSITORY" --json url,assets
