name: Publish JARVIS v3.14.10 Google News LIVE publisher beta

on:
  push:
    branches:
      - fix/google-news-live-publisher-v3150-20261122
    paths:
      - .github/workflows/publish-v3.14.10-google-news-live-publisher.yml
      - 'app/**'
      - 'tests/**'
      - 'scripts/tester_sources.sh'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate-build-publish:
    if: github.repository == 'philippe015/friday-assistant'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Python 3.14 for Chaquopy
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Android SDK
        run: |
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Rust Android target
        run: |
          rustup target add aarch64-linux-android
          cargo install cargo-ndk --locked

      - name: Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Regression tests (Python Java JS Rust)
        run: bash scripts/tester_sources.sh

      - name: Build Rust JNI
        run: |
          cd native
          cargo ndk -t arm64-v8a -o ../app/src/main/jniLibs build --release

      - name: Compile Android debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Verify and prepare beta APK
        run: |
          grep -Fq "versionCode 104" app/build.gradle
          grep -Fq "versionName '3.14.10'" app/build.gradle
          grep -Fq "applicationIdSuffix '.readerfixpreview'" app/build.gradle
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk \
            dist/JARVIS-v3.14.10-google-news-live-publisher-beta.apk
          test -s dist/JARVIS-v3.14.10-google-news-live-publisher-beta.apk
          unzip -t dist/JARVIS-v3.14.10-google-news-live-publisher-beta.apk >/dev/null
          sha256sum dist/JARVIS-v3.14.10-google-news-live-publisher-beta.apk \
            | tee dist/SHA256SUMS.txt

      - name: Upload verified APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-v3.14.10-google-news-live-publisher-beta
          path: |
            dist/JARVIS-v3.14.10-google-news-live-publisher-beta.apk
            dist/SHA256SUMS.txt

      - name: Publish downloadable beta release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v3.14.10-google-news-live-publisher-beta"
          APK="dist/JARVIS-v3.14.10-google-news-live-publisher-beta.apk"
          cat > dist/NOTES.md <<'EOF'
          Bêta Android JARVIS v3.14.10 — accès vérifié aux DIRECT Google Actualités.
          Le titre d'une brève Google News peut correspondre à un passage d'un
          direct plutôt qu'au titre de la page du média. Le lecteur cherche
          désormais l'éditeur connu (notamment BFM), tente une recherche exacte
          puis une requête ciblée sur son domaine officiel. Il valide le
          domaine HTTPS ET la concordance du titre ou du passage publié avant
          de considérer une page comme pertinente.
          Pour les pages de direct, seules les phrases publiques correspondant
          au sujet sont proposées, avec mention « contenu partiel » :
          jamais une lecture du DIRECT entier présentée comme un article.
          Si le média refuse l'accès, nécessite JavaScript ou supprime la
          page, JARVIS ne contourne pas ces protections et indique honnêtement
          que l'article n'est pas accessible. Les filtres micro, l'IA LiteRT
          locale, le profil et la mémoire chiffrée restent inchangés.
                    À installer seulement pour tests. Le package debug est
          fr.friday.assistant.readerfixpreview ; une signature Android debug
          différente peut empêcher la mise à jour sans perte de données.
          Gardez l'APK fonctionnelle et ses sauvegardes. Le modèle local doit
          être installé séparément. Essais réels sur téléphone non certifiés.
          EOF
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" dist/SHA256SUMS.txt --clobber
          else
            gh release create "$TAG" "$APK" dist/SHA256SUMS.txt \
              --target "$GITHUB_SHA" --prerelease \
              --title "JARVIS v3.14.10 — Google News DIRECT + éditeur (bêta)" \
              --notes-file dist/NOTES.md
          fi
