name: Publish JARVIS v3.14.11 RSS publisher article body matching beta

on:
  push:
    branches:
      - fix/rss-article-body-match-v31411-20261122
    paths:
      - .github/workflows/publish-v3.14.11-rss-article-body-match.yml
      - 'app/**'
      - 'tests/**'
      - 'scripts/tester_sources.sh'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate-build-publish:
    if: github.repository == 'philippe015/friday-assistant'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Python 3.14 for Chaquopy
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Android SDK
        run: |
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Rust Android target
        run: |
          rustup target add aarch64-linux-android
          cargo install cargo-ndk --locked

      - name: Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Regression tests (Python Java JS Rust)
        run: bash scripts/tester_sources.sh

      - name: Build Rust JNI
        run: |
          cd native
          cargo ndk -t arm64-v8a -o ../app/src/main/jniLibs build --release

      - name: Compile Android debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Verify and prepare beta APK
        run: |
          grep -Fq "versionCode 105" app/build.gradle
          grep -Fq "versionName '3.14.11'" app/build.gradle
          grep -Fq "applicationIdSuffix '.readerfixpreview'" app/build.gradle
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk \
            dist/JARVIS-v3.14.11-rss-article-body-match-beta.apk
          test -s dist/JARVIS-v3.14.11-rss-article-body-match-beta.apk
          unzip -t dist/JARVIS-v3.14.11-rss-article-body-match-beta.apk >/dev/null
          sha256sum dist/JARVIS-v3.14.11-rss-article-body-match-beta.apk \
            | tee dist/SHA256SUMS.txt

      - name: Upload verified APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-v3.14.11-rss-article-body-match-beta
          path: |
            dist/JARVIS-v3.14.11-rss-article-body-match-beta.apk
            dist/SHA256SUMS.txt

      - name: Publish downloadable beta release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v3.14.11-rss-article-body-match-beta"
          APK="dist/JARVIS-v3.14.11-rss-article-body-match-beta.apk"
          cat > dist/NOTES.md <<'EOF'
          Bêta Android JARVIS v3.14.11 — lecture RSS chez l'éditeur.
          Correctif du rapport 22/11/2026 16h34 : une commande Vosk
          « lit l'article numéro deux en entier » était bien reconnue,
          mais Le Figaro était introuvable via le seul titre de l'index.
          Quand le titre de la page publique diffère de celui du RSS,
          JARVIS peut désormais vérifier une section réelle du texte sur
          le domaine de l'éditeur et n'accepter qu'une très forte
          correspondance du sujet. Pour éviter de substituer un article
          voisin, la lecture n'affiche que ce passage comme PARTIEL,
          sans prétendre connaître le texte intégral.
          Une erreur claire distingue article non trouvé ou non indexé
          et DIRECT non résolu. Aucune mémoire personnelle, aucun profil,
          aucune localisation n'est transmis au moteur de recherche.
          Les abonnements, refus d'accès, pages JavaScript et droits des
          éditeurs restent respectés. Les anciens correctifs
          LiteRT, Vosk, GPS et Google News DIRECT sont conservés.
                    À installer seulement pour tests. Le package debug est
          fr.friday.assistant.readerfixpreview ; une signature Android debug
          différente peut empêcher la mise à jour sans perte de données.
          Gardez l'APK fonctionnelle et ses sauvegardes. Le modèle local doit
          être installé séparément. Essais réels sur téléphone non certifiés.
          EOF
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" dist/SHA256SUMS.txt --clobber
          else
            gh release create "$TAG" "$APK" dist/SHA256SUMS.txt \
              --target "$GITHUB_SHA" --prerelease \
              --title "JARVIS v3.14.11 — RSS publisher + article text (bêta)" \
              --notes-file dist/NOTES.md
          fi
