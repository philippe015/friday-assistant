name: Publish JARVIS v3.14.13 Diagnostic log accuracy and RSS failure causes beta

on:
  push:
    branches:
      - fix/diagnostic-log-fidelity-v31413-20261122
    paths:
      - .github/workflows/publish-v3.14.13-diagnostics-rss-cause-fix.yml
      - 'app/**'
      - 'tests/**'
      - 'scripts/tester_sources.sh'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate-build-publish:
    if: github.repository == 'philippe015/friday-assistant'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Python 3.14 for Chaquopy
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Android SDK
        run: |
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Rust Android target
        run: |
          rustup target add aarch64-linux-android
          cargo install cargo-ndk --locked

      - name: Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Regression tests (Python Java JS Rust)
        run: bash scripts/tester_sources.sh

      - name: Build Rust JNI
        run: |
          cd native
          cargo ndk -t arm64-v8a -o ../app/src/main/jniLibs build --release

      - name: Compile Android debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Verify and prepare beta APK
        run: |
          grep -Fq "versionCode 107" app/build.gradle
          grep -Fq "versionName '3.14.13'" app/build.gradle
          grep -Fq "applicationIdSuffix '.readerfixpreview'" app/build.gradle
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk \
            dist/JARVIS-v3.14.13-diagnostics-rss-cause-fix-beta.apk
          test -s dist/JARVIS-v3.14.13-diagnostics-rss-cause-fix-beta.apk
          unzip -t dist/JARVIS-v3.14.13-diagnostics-rss-cause-fix-beta.apk >/dev/null
          sha256sum dist/JARVIS-v3.14.13-diagnostics-rss-cause-fix-beta.apk \
            | tee dist/SHA256SUMS.txt

      - name: Upload verified APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-v3.14.13-diagnostics-rss-cause-fix-beta
          path: |
            dist/JARVIS-v3.14.13-diagnostics-rss-cause-fix-beta.apk
            dist/SHA256SUMS.txt

      - name: Publish downloadable beta release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v3.14.13-diagnostics-rss-cause-fix-beta"
          APK="dist/JARVIS-v3.14.13-diagnostics-rss-cause-fix-beta.apk"
          cat > dist/NOTES.md <<'EOF'
          Bêta Android JARVIS v3.14.13 — corrections issues du journal.
          Un rapport réel v3.14.12 comportant 114 événements sur environ
          11 minutes a révélé un échec RSS_PUBLISHER_NOT_FOUND, sans panne
          du moteur LiteRT GPU, et des faux événements VOSK_WAKE ou
          RESPONSE_PREPARED produits par le journal lui-même.
          Le journal sépare désormais le temps de préparation de la
          première parole TTS et les événements MICRO / dictée directe /
          activation par mot-clé. Le texte « sans mot-clé » ne sera
          plus classé comme activation réelle.
          La recherche d'article Google Actualités ajoute des codes
          locaux chiffrés qui distinguent résultats absents Bing/DDG,
          service indisponible, domaine éditeur absent, accès à la page
          refusé, titre non concordant ou contenu insuffisant.
          Jamais d'URL, requête, article, nom, conversation, coordonnées
          ou prompt enregistrés dans les logs ; export JSON uniquement
          avec action explicite sur Android.
          Toutes les améliorations v3.14.12 (sauvegarde chiffrée,
          rotation 14 jours, 420 événements) restent conservées.
                    À installer seulement pour tests. Le package debug est
          fr.friday.assistant.readerfixpreview ; une signature Android debug
          différente peut empêcher la mise à jour sans perte de données.
          Gardez l'APK fonctionnelle et ses sauvegardes. Le modèle local doit
          être installé séparément. Essais réels sur téléphone non certifiés.
          EOF
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" dist/SHA256SUMS.txt --clobber
          else
            gh release create "$TAG" "$APK" dist/SHA256SUMS.txt \
              --target "$GITHUB_SHA" --prerelease \
              --title "JARVIS v3.14.13 — Diagnostics fidèles et recherche RSS (bêta)" \
              --notes-file dist/NOTES.md
          fi
