name: Publish JARVIS v3.14.14 Optional encrypted conversation diagnostic report beta

on:
  push:
    branches:
      - feature/conversation-diagnostics-optin-v31414-20261122
    paths:
      - .github/workflows/publish-v3.14.14-conversation-diagnostic-optin.yml
      - 'app/**'
      - 'tests/**'
      - 'scripts/tester_sources.sh'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate-build-publish:
    if: github.repository == 'philippe015/friday-assistant'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Python 3.14 for Chaquopy
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Android SDK
        run: |
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Rust Android target
        run: |
          rustup target add aarch64-linux-android
          cargo install cargo-ndk --locked

      - name: Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Regression tests (Python Java JS Rust)
        run: bash scripts/tester_sources.sh

      - name: Build Rust JNI
        run: |
          cd native
          cargo ndk -t arm64-v8a -o ../app/src/main/jniLibs build --release

      - name: Compile Android debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Verify and prepare beta APK
        run: |
          grep -Fq "versionCode 108" app/build.gradle
          grep -Fq "versionName '3.14.14'" app/build.gradle
          grep -Fq "applicationIdSuffix '.readerfixpreview'" app/build.gradle
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk \
            dist/JARVIS-v3.14.14-conversation-diagnostic-optin-beta.apk
          test -s dist/JARVIS-v3.14.14-conversation-diagnostic-optin-beta.apk
          unzip -t dist/JARVIS-v3.14.14-conversation-diagnostic-optin-beta.apk >/dev/null
          sha256sum dist/JARVIS-v3.14.14-conversation-diagnostic-optin-beta.apk \
            | tee dist/SHA256SUMS.txt

      - name: Upload verified APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-v3.14.14-conversation-diagnostic-optin-beta
          path: |
            dist/JARVIS-v3.14.14-conversation-diagnostic-optin-beta.apk
            dist/SHA256SUMS.txt

      - name: Publish downloadable beta release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v3.14.14-conversation-diagnostic-optin-beta"
          APK="dist/JARVIS-v3.14.14-conversation-diagnostic-optin-beta.apk"
          cat > dist/NOTES.md <<'EOF'
          Bêta Android JARVIS v3.14.14 — rapport de diagnostic enrichi.
          La conversation JARVIS est maintenant jointe aux logs sur demande.
          Dans Cockpit > Exporter rapport / conversation, une case
          « Inclure la conversation : questions et réponses » est
          proposée, désactivée par défaut pour protéger la vie privée.
          Sans la case, les anciens logs techniques restent sans contenu
          de conversation. Avec la case, le JSON combine événements
          techniques et les 80 messages les plus récents déjà chiffrés
          dans l'historique Android, avec rôle (vous/Jarvis), provenance
          vocale ou écrite, et heure UTC des nouveaux échanges.
          Un champ timeline relie événements et réponses dans l'ordre ;
          aucun texte n'est dupliqué dans les codes techniques.
          Pour les messages antérieurs à la mise à jour, l'heure exacte
          n'est pas inventée : time_unknown=true.
          Le fichier JSON exporté est NON CHIFFRÉ, peut contenir
          des informations privées. Il est enregistré seulement
          après confirmation dans le sélecteur Android.
          Aucune sauvegarde automatique sur GitHub ou Internet.
          Le journal technique reste chiffré via Android Keystore,
          plafonné à 420 événements / 14 jours. Les correctifs de
          diagnostics RSS/Vosk/TTS des versions 3.14.12 et 3.14.13
          sont conservés. Les tests de confidentialité sont étendus.
                    À installer seulement pour tests. Le package debug est
          fr.friday.assistant.readerfixpreview ; une signature Android debug
          différente peut empêcher la mise à jour sans perte de données.
          Gardez l'APK fonctionnelle et ses sauvegardes. Le modèle local doit
          être installé séparément. Essais réels sur téléphone non certifiés.
          EOF
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" dist/SHA256SUMS.txt --clobber
          else
            gh release create "$TAG" "$APK" dist/SHA256SUMS.txt \
              --target "$GITHUB_SHA" --prerelease \
              --title "JARVIS v3.14.14 — Rapport conversation et journaux (bêta)" \
              --notes-file dist/NOTES.md
          fi
