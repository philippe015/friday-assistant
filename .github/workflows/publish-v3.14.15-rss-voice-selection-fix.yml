name: Publish JARVIS v3.14.15 RSS article voice selection recovery beta

on:
  push:
    branches:
      - fix/rss-voice-article-selection-v31415-20261122
    paths:
      - .github/workflows/publish-v3.14.15-rss-voice-selection-fix.yml
      - 'app/**'
      - 'tests/**'
      - 'scripts/tester_sources.sh'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate-build-publish:
    if: github.repository == 'philippe015/friday-assistant'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Python 3.14 for Chaquopy
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Android SDK
        run: |
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Rust Android target
        run: |
          rustup target add aarch64-linux-android
          cargo install cargo-ndk --locked

      - name: Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Regression tests (Python Java JS Rust)
        run: bash scripts/tester_sources.sh

      - name: Build Rust JNI
        run: |
          cd native
          cargo ndk -t arm64-v8a -o ../app/src/main/jniLibs build --release

      - name: Compile Android debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Verify and prepare beta APK
        run: |
          grep -Fq "versionCode 109" app/build.gradle
          grep -Fq "versionName '3.14.15'" app/build.gradle
          grep -Fq "applicationIdSuffix '.readerfixpreview'" app/build.gradle
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk \
            dist/JARVIS-v3.14.15-rss-voice-selection-fix-beta.apk
          test -s dist/JARVIS-v3.14.15-rss-voice-selection-fix-beta.apk
          unzip -t dist/JARVIS-v3.14.15-rss-voice-selection-fix-beta.apk >/dev/null
          sha256sum dist/JARVIS-v3.14.15-rss-voice-selection-fix-beta.apk \
            | tee dist/SHA256SUMS.txt

      - name: Upload verified APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-v3.14.15-rss-voice-selection-fix-beta
          path: |
            dist/JARVIS-v3.14.15-rss-voice-selection-fix-beta.apk
            dist/SHA256SUMS.txt

      - name: Publish downloadable beta release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v3.14.15-rss-voice-selection-fix-beta"
          APK="dist/JARVIS-v3.14.15-rss-voice-selection-fix-beta.apk"
          cat > dist/NOTES.md <<'EOF'
          Bêta Android JARVIS v3.14.15 — lecture RSS corrigée à partir
          du rapport avec conversation 22 novembre 2026 (4 échanges).
          Symptôme : la demande « lily l'article numéro deux en entier »
          déclenchait 79 ms de clarification locale alors qu'un article
          numéro deux était parfaitement identifiable.
          Correction : un numéro explicite + « en entier » permet la
          lecture du vrai texte public via l'outil RSS même lorsque
          Vosk déforme le verbe « lis » en « lily ».
          La dictée « article numéro de en entier » NE suppose jamais
          un numéro non reconnu ; JARVIS demande seulement la valeur
          manquante (un, deux ou trois) pour réduire les répétitions.
          Les journaux techniques chiffrés enregistrent un code
          RSS_VOSK_NUMBER_MISSING ou RSS_VOSK_AMBIGUOUS.
          La recherche de nouveautés généralistes ignore une amorce
          Vosk très précise « j'ai envie de moi les dernières actualités »
          qui faussait le sujet (« envie ») et renvoyait des titres
          sans lien avec l'intention. Sans « heures » clairement entendu,
          les actualités conservent le délai par défaut de 24 heures.
          Tests de non-régression Java + Python sur les phrases du
          rapport, et anciennes protections anti-écho/RSS conservées.
          Aucune promesse d'extraire les sites payants/JS/non indexés.
          L'export opt-in avec conversation et le stockage privé AES-GCM
          de la version 3.14.14 sont entièrement conservés.
                    À installer seulement pour tests. Le package debug est
          fr.friday.assistant.readerfixpreview ; une signature Android debug
          différente peut empêcher la mise à jour sans perte de données.
          Gardez l'APK fonctionnelle et ses sauvegardes. Le modèle local doit
          être installé séparément. Essais réels sur téléphone non certifiés.
          EOF
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" dist/SHA256SUMS.txt --clobber
          else
            gh release create "$TAG" "$APK" dist/SHA256SUMS.txt \
              --target "$GITHUB_SHA" --prerelease \
              --title "JARVIS v3.14.15 — Commandes vocales lecture d'articles RSS (bêta)" \
              --notes-file dist/NOTES.md
          fi
