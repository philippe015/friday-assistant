name: Publish JARVIS v3.14.17 Extended encrypted conversation memory beta

on:
  push:
    branches:
      - feature/extended-conversation-memory-v31417-20261122
    paths:
      - .github/workflows/publish-v3.14.17-extended-encrypted-memory.yml
      - 'app/**'
      - 'tests/**'
      - 'scripts/tester_sources.sh'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate-build-publish:
    if: github.repository == 'philippe015/friday-assistant'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Python 3.14 for Chaquopy
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Android SDK
        run: |
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Rust Android target
        run: |
          rustup target add aarch64-linux-android
          cargo install cargo-ndk --locked

      - name: Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Regression tests (Python Java JS Rust)
        run: bash scripts/tester_sources.sh

      - name: Build Rust JNI
        run: |
          cd native
          cargo ndk -t arm64-v8a -o ../app/src/main/jniLibs build --release

      - name: Compile Android debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Verify and prepare beta APK
        run: |
          grep -Fq "versionCode 111" app/build.gradle
          grep -Fq "versionName '3.14.17'" app/build.gradle
          grep -Fq "applicationIdSuffix '.readerfixpreview'" app/build.gradle
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk \
            dist/JARVIS-v3.14.17-extended-encrypted-memory-beta.apk
          test -s dist/JARVIS-v3.14.17-extended-encrypted-memory-beta.apk
          unzip -t dist/JARVIS-v3.14.17-extended-encrypted-memory-beta.apk >/dev/null
          sha256sum dist/JARVIS-v3.14.17-extended-encrypted-memory-beta.apk \
            | tee dist/SHA256SUMS.txt

      - name: Upload verified APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-v3.14.17-extended-encrypted-memory-beta
          path: |
            dist/JARVIS-v3.14.17-extended-encrypted-memory-beta.apk
            dist/SHA256SUMS.txt

      - name: Publish downloadable beta release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v3.14.17-extended-encrypted-memory-beta"
          APK="dist/JARVIS-v3.14.17-extended-encrypted-memory-beta.apk"
          cat > dist/NOTES.md <<'EOF'
          Bêta Android JARVIS v3.14.17 — Memory+ de conversation étendue.
          Historique chiffré local jusqu'à 240 messages (~120 échanges),
          au lieu de 80, avec budget de stockage de 320 000 caractères
          JSON et limite par message, suppression des entrées les plus
          anciennes. La mémoire n'est pas synchronisée sur le Web.
          Chaque réponse sélectionne au plus dix messages récents et
          quatre anciens sujets thématiquement pertinents, sans
          dépasser les limites du modèle local.
          Les questions ÉCRITES réutilisent maintenant le même
          historique chiffré que les questions VOCALES.
          En cas de référence ambiguë SANS antécédent utilisable
          (ex. « et le deuxième ? », « et lui ? », « développe »),
          JARVIS demande quelle personne, liste ou sujet est visé,
          plutôt que d'inventer une réponse. Le Web n'a jamais accès
          à l'historique ou à cette clarification.
          En cas de réduction de la fenêtre de contexte LiteRT-LM,
          les paroles récentes et non le seul texte de clôture du
          prompt sont conservées, même en budget de secours.
          Le Cockpit reste fluide avec l'affichage des 80 messages
          les plus récents ; l'export diagnostic avec conversation
          reste limité à 80 messages et ne partage rien sur GitHub
          automatiquement. Les modèles compatibles et le matériel
          restent indispensables. Tests et essais sur téléphone requis.
                    À installer seulement pour tests. Le package debug est
          fr.friday.assistant.readerfixpreview ; une signature Android debug
          différente peut empêcher la mise à jour sans perte de données.
          Gardez l'APK fonctionnelle et ses sauvegardes. Le modèle local doit
          être installé séparément. Essais réels sur téléphone non certifiés.
          EOF
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" dist/SHA256SUMS.txt --clobber
          else
            gh release create "$TAG" "$APK" dist/SHA256SUMS.txt \
              --target "$GITHUB_SHA" --prerelease \
              --title "JARVIS v3.14.17 — Mémoire de dialogue étendue et clarifications (bêta)" \
              --notes-file dist/NOTES.md
          fi
