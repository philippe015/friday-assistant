name: Publish JARVIS v3.14.7 RSS source echo beta

on:
  push:
    branches:
      - fix/rss-source-url-echo-v3147-20261122
    paths:
      - .github/workflows/publish-v3.14.7-rss-source-echo.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate-build-publish:
    if: github.repository == 'philippe015/friday-assistant'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Python 3.14 for Chaquopy
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Android SDK
        run: |
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Rust Android target
        run: |
          rustup target add aarch64-linux-android
          cargo install cargo-ndk --locked

      - name: Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Regression tests (Python Java JS Rust)
        run: bash scripts/tester_sources.sh

      - name: Build Rust JNI
        run: |
          cd native
          cargo ndk -t arm64-v8a -o ../app/src/main/jniLibs build --release

      - name: Compile Android debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Verify and prepare beta APK
        run: |
          grep -Fq "versionCode 101" app/build.gradle
          grep -Fq "versionName '3.14.7'" app/build.gradle
          grep -Fq "applicationIdSuffix '.readerfixpreview'" app/build.gradle
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk \
            dist/JARVIS-v3.14.7-rss-source-echo-beta.apk
          test -s dist/JARVIS-v3.14.7-rss-source-echo-beta.apk
          unzip -t dist/JARVIS-v3.14.7-rss-source-echo-beta.apk >/dev/null
          sha256sum dist/JARVIS-v3.14.7-rss-source-echo-beta.apk \
            | tee dist/SHA256SUMS.txt

      - name: Upload verified APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-v3.14.7-rss-source-echo-beta
          path: |
            dist/JARVIS-v3.14.7-rss-source-echo-beta.apk
            dist/SHA256SUMS.txt

      - name: Publish downloadable beta release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v3.14.7-rss-source-echo-beta"
          APK="dist/JARVIS-v3.14.7-rss-source-echo-beta.apk"
          cat > dist/NOTES.md <<'EOF'
          Bêta Android JARVIS v3.14.7 — correctif RSS Google Actualités.
          Identifie le domaine réel de l'éditeur grâce au lien <source url>
          dans le flux RSS, puis confirme domaine et titre via une recherche
          publique avant de lire le texte HTTPS accessible. Aucun contournement
          des sites payants ou pages JavaScript. Si le texte intégral est
          indisponible, la réponse explique l'échec sans inventer le contenu.
          Les sous-transcriptions de la propre voix de JARVIS (echo TTS) sont
          masquées dans le cockpit lorsque reconnaissables ; le filtre final
          anti-auto-réponse, STOP par bouton et l'écoute continue sont conservés.
          Profil/mémoire chiffrés locaux ; aucune IA distante.

          À installer seulement pour tests. Le package debug est
          fr.friday.assistant.readerfixpreview ; une signature Android debug
          différente peut empêcher la mise à jour sans perte de données.
          Gardez l'APK fonctionnelle et ses sauvegardes. Le modèle local doit
          être installé séparément. Essais réels sur téléphone non certifiés.
          EOF
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" dist/SHA256SUMS.txt --clobber
          else
            gh release create "$TAG" "$APK" dist/SHA256SUMS.txt \
              --target "$GITHUB_SHA" --prerelease \
              --title "JARVIS v3.14.7 — RSS éditeur + anti-écho (bêta)" \
              --notes-file dist/NOTES.md
          fi
