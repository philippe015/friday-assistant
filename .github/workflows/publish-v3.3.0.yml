name: Publish FRIDAY v3.3.0

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-v3.3.0.yml'

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout version 3.3.0
        uses: actions/checkout@v4

      - name: Vérifier version Mistral
        run: |
          set -euo pipefail
          grep -Fq "versionCode 54" app/build.gradle
          grep -Fq "versionName '3.3.0'" app/build.gradle

      - name: Vérifier compilation APK officielle signée
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run watch 43723691550 --repo "$GITHUB_REPOSITORY" --exit-status --interval 10

      - name: Télécharger APK release signé
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run download 43723691550 --repo "$GITHUB_REPOSITORY" \
            --name FRIDAY-release-signed-apk --dir dist
          test -s dist/app-release.apk
          unzip -tq dist/app-release.apk
          mv dist/app-release.apk dist/FRIDAY-v3.3.0-release.apk
          sha256sum dist/FRIDAY-v3.3.0-release.apk

      - name: Créer tag v3.3.0
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if ! gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v3.3.0" >/dev/null 2>&1; then
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
              -f ref='refs/tags/v3.3.0' -f sha="$GITHUB_SHA"
          fi

      - name: Publier la release Android Mistral
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view v3.3.0 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload v3.3.0 dist/FRIDAY-v3.3.0-release.apk --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create v3.3.0 dist/FRIDAY-v3.3.0-release.apk \
              --repo "$GITHUB_REPOSITORY" --verify-tag \
              --title "F.R.I.D.A.Y. v3.3.0 - Mistral uniquement" \
              --notes "Mistral AI remplace entièrement DeepSeek pour les réponses et la recherche Web. Mistral Chat Completions pour le dialogue ; Mistral Conversations avec web_search pour la recherche sourcée. L'ancienne clé DeepSeek est supprimée des préférences, une clé Mistral existante est conservée lorsqu'elle existe. Nouvelle clé API Mistral à saisir dans les réglages. Même application et signature Android, versionCode 54. API Web et comportement vocal à tester sur appareil ; usage Mistral potentiellement facturé."
          fi
          gh release view v3.3.0 --repo "$GITHUB_REPOSITORY" --json url,assets
