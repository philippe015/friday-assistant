name: Publish FRIDAY v3.4.1

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-v3.4.1.yml'

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout v3.4.1
        uses: actions/checkout@v7

      - name: Validate app version
        run: |
          set -euo pipefail
          grep -Fq "versionCode 56" app/build.gradle
          grep -Fq "versionName '3.4.1'" app/build.gradle

      - name: Wait for signed APK build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run watch 43733159594 --repo "$GITHUB_REPOSITORY" --exit-status --interval 10

      - name: Download and verify signed APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run download 43733159594 --repo "$GITHUB_REPOSITORY" \
            --name FRIDAY-release-signed-apk --dir dist
          test -s dist/app-release.apk
          unzip -tq dist/app-release.apk
          mv dist/app-release.apk dist/FRIDAY-v3.4.1-release.apk
          sha256sum dist/FRIDAY-v3.4.1-release.apk

      - name: Tag version v3.4.1
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if ! gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v3.4.1" >/dev/null 2>&1; then
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
              -f ref='refs/tags/v3.4.1' -f sha="$GITHUB_SHA"
          fi

      - name: Publish official signed release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view v3.4.1 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload v3.4.1 dist/FRIDAY-v3.4.1-release.apk \
              --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create v3.4.1 dist/FRIDAY-v3.4.1-release.apk \
              --repo "$GITHUB_REPOSITORY" --verify-tag \
              --title "F.R.I.D.A.Y. v3.4.1 - Identité et GPS Mistral corrigés" \
              --notes "Correctifs : l'identité est issue du profil de personnalité actif, et Mistral n'est plus présenté comme le nom de l'assistant. Si le partage GPS ponctuel est explicitement autorisé, les questions de position ('Où suis-je ?') transmettent désormais les coordonnées Android à l'API Mistral, au lieu de répondre systématiquement en local. Le cockpit affiche le consentement GPS vers Mistral et l'heure du dernier envoi API réussi. Redémarrez l'écoute si vous avez modifié les permissions GPS après son démarrage. GPS local et envoi externe restent séparés. APK signé versionCode 56, tests et compilation Android validés. Le fonctionnement réel avec votre clé Mistral et votre GPS doit encore être confirmé sur appareil."
          fi
          gh release view v3.4.1 --repo "$GITHUB_REPOSITORY" --json url,assets
