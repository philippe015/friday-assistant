name: Publish FRIDAY v3.6.0

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-v3.6.0.yml'

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout v3.6.0
        uses: actions/checkout@v4

      - name: Validate app version
        run: |
          set -euo pipefail
          grep -Fq "versionCode 58" app/build.gradle
          grep -Fq "versionName '3.6.0'" app/build.gradle

      - name: Wait for signed APK build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run watch 43749643480 --repo "$GITHUB_REPOSITORY" --exit-status --interval 10

      - name: Download and verify signed APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run download 43749643480 --repo "$GITHUB_REPOSITORY" \
            --name FRIDAY-release-signed-apk --dir dist
          test -s dist/app-release.apk
          unzip -tq dist/app-release.apk
          mv dist/app-release.apk dist/FRIDAY-v3.6.0-release.apk
          sha256sum dist/FRIDAY-v3.6.0-release.apk

      - name: Tag version v3.6.0
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if ! gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v3.6.0" >/dev/null 2>&1; then
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
              -f ref='refs/tags/v3.6.0' -f sha="$GITHUB_SHA"
          fi

      - name: Publish official signed release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view v3.6.0 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload v3.6.0 dist/FRIDAY-v3.6.0-release.apk \
              --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create v3.6.0 dist/FRIDAY-v3.6.0-release.apk \
              --repo "$GITHUB_REPOSITORY" --verify-tag \
              --title "F.R.I.D.A.Y. v3.6.0 - Streaming Mistral et TTS progressif" \
              --notes "FRIDAY v3.6.0 : réponses Chat Completions Mistral SSE progressivement lues par le moteur vocal Android ; file TTS bornée, interruption de la génération et de la parole, réglage de désactivation du streaming et mesure de la première parole. Le Web Conversations reste non-streaming avec ses sources ; profils et GPS préservés. APK signé versionCode 58. Les essais vocaux sur téléphone et la latence réelle restent à confirmer."
          fi
          gh release view v3.6.0 --repo "$GITHUB_REPOSITORY" --json url,assets
