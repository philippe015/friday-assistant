name: Publish FRIDAY v3.7.0

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-v3.7.0.yml'

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout v3.7.0
        uses: actions/checkout@v7

      - name: Validate app version
        run: |
          set -euo pipefail
          grep -Fq "versionCode 59" app/build.gradle
          grep -Fq "versionName '3.7.0'" app/build.gradle

      - name: Wait for signed APK build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run watch 43750471582 --repo "$GITHUB_REPOSITORY" --exit-status --interval 10

      - name: Download and verify signed APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run download 43750471582 --repo "$GITHUB_REPOSITORY" \
            --name FRIDAY-release-signed-apk --dir dist
          test -s dist/app-release.apk
          unzip -tq dist/app-release.apk
          mv dist/app-release.apk dist/FRIDAY-v3.7.0-release.apk
          sha256sum dist/FRIDAY-v3.7.0-release.apk

      - name: Tag version v3.7.0
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if ! gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v3.7.0" >/dev/null 2>&1; then
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
              -f ref='refs/tags/v3.7.0' -f sha="$GITHUB_SHA"
          fi

      - name: Publish official signed release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view v3.7.0 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload v3.7.0 dist/FRIDAY-v3.7.0-release.apk \
              --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create v3.7.0 dist/FRIDAY-v3.7.0-release.apk \
              --repo "$GITHUB_REPOSITORY" --verify-tag \
              --title "F.R.I.D.A.Y. v3.7.0 - Vosk spécialisé et écoute ponctuelle" \
              --notes "FRIDAY v3.7.0 : nouveau mode une question qui ferme le microphone après l'énoncé et libère le service à la fin de la réponse ; vocabulaire Vosk optionnel limité à 24 expressions, sauvegardé via Android Keystore, avec [unk] et commandes Friday intégrées ; nouveaux diagnostics de mode vocal. Mode continu, streaming Mistral, identité du profil et consentement GPS conservés. Fonction expérimentale non activée par défaut. Aucune mesure sur appareil de batterie ou de précision ASR revendiquée. APK signé versionCode 59, tests et compilation CI réussis."
          fi
          gh release view v3.7.0 --repo "$GITHUB_REPOSITORY" --json url,assets
