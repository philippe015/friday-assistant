name: Publish FRIDAY v3.7.2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-v3.7.2.yml'

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout v3.7.2
        uses: actions/checkout@v7

      - name: Validate app version
        run: |
          set -euo pipefail
          grep -Fq "versionCode 61" app/build.gradle
          grep -Fq "versionName '3.7.2'" app/build.gradle

      - name: Wait for signed APK build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run watch 43757464068 --repo "$GITHUB_REPOSITORY" --exit-status --interval 10

      - name: Download and verify signed APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run download 43757464068 --repo "$GITHUB_REPOSITORY" \
            --name FRIDAY-release-signed-apk --dir dist
          test -s dist/app-release.apk
          unzip -tq dist/app-release.apk
          mv dist/app-release.apk dist/FRIDAY-v3.7.2-release.apk
          sha256sum dist/FRIDAY-v3.7.2-release.apk

      - name: Tag version v3.7.2
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if ! gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v3.7.2" >/dev/null 2>&1; then
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
              -f ref='refs/tags/v3.7.2' -f sha="$GITHUB_SHA"
          fi

      - name: Publish official signed release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view v3.7.2 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload v3.7.2 dist/FRIDAY-v3.7.2-release.apk \
              --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create v3.7.2 dist/FRIDAY-v3.7.2-release.apk \
              --repo "$GITHUB_REPOSITORY" --verify-tag \
              --title "F.R.I.D.A.Y. v3.7.2 - Décodeur STOP vocal dédié" \
              --notes "FRIDAY v3.7.2 : décodeur Vosk supplémentaire réservé aux commandes STOP, arrête, attends et j'ai une précision, en parallèle de la dictée générale, uniquement pendant les réponses. Détection sur résultats partiels confirmés ou fin de phrase, anti-écho, interruption TTS et reprise des précisions. Nouvelle télémétrie Interruption vocale dans le cockpit pour distinguer microphone Android muet, décodeur indisponible et commande reconnue. Mistral reste le fournisseur unique ; personnalités et GPS préservés. APK Android signé versionCode 61. Qualité des commandes vocales pendant les haut-parleurs non garantie sans essai sur téléphone."
          fi
          gh release view v3.7.2 --repo "$GITHUB_REPOSITORY" --json url,assets
