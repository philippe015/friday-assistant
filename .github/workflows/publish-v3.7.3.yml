name: Publish FRIDAY v3.7.3

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-v3.7.3.yml'

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout v3.7.3
        uses: actions/checkout@v7

      - name: Validate app version
        run: |
          set -euo pipefail
          grep -Fq "versionCode 62" app/build.gradle
          grep -Fq "versionName '3.7.3'" app/build.gradle

      - name: Wait for signed APK build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run watch 43762056338 --repo "$GITHUB_REPOSITORY" --exit-status --interval 10

      - name: Download and verify signed APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run download 43762056338 --repo "$GITHUB_REPOSITORY" \
            --name FRIDAY-release-signed-apk --dir dist
          test -s dist/app-release.apk
          unzip -tq dist/app-release.apk
          mv dist/app-release.apk dist/FRIDAY-v3.7.3-release.apk
          sha256sum dist/FRIDAY-v3.7.3-release.apk

      - name: Tag version v3.7.3
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if ! gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v3.7.3" >/dev/null 2>&1; then
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
              -f ref='refs/tags/v3.7.3' -f sha="$GITHUB_SHA"
          fi

      - name: Publish official signed release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view v3.7.3 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload v3.7.3 dist/FRIDAY-v3.7.3-release.apk \
              --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create v3.7.3 dist/FRIDAY-v3.7.3-release.apk \
              --repo "$GITHUB_REPOSITORY" --verify-tag \
              --title "F.R.I.D.A.Y. v3.7.3 - STOP répété et diagnostic du micro" \
              --notes "FRIDAY v3.7.3 : corrige la reconnaissance de commandes vocales répétées « stop stop », « stop stop stop » et « arrête arrête ». Le décodeur Vosk STOP dédié reconnaît ces combinaisons et peut interrompre après un premier résultat partiel répété, tout en conservant le filtre anti-écho. Le cockpit affiche maintenant le niveau du signal audio reçu par le micro (0 à 100) pendant les réponses : cette mesure peut inclure le son du haut-parleur et ne prouve pas que la voix de l'utilisateur est comprise. Mistral unique, profils, GPS et interruptions TTS conservés. APK Android signé versionCode 62, CI validée ; essais vocaux sur appareil nécessaires."
          fi
          gh release view v3.7.3 --repo "$GITHUB_REPOSITORY" --json url,assets
