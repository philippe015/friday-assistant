name: Publish FRIDAY v3.8.7

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-v3.8.7.yml'

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact release commit
        uses: actions/checkout@v7

      - name: Confirm version
        run: |
          set -euo pipefail
          grep -Fq "versionCode 70" app/build.gradle
          grep -Fq "versionName '3.8.7'" app/build.gradle

      - name: Find successful signed APK build for this commit
        id: signed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          RUN_ID=""
          for attempt in $(seq 1 36); do
            RUN_ID="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow "Build APK" \
              --commit "$GITHUB_SHA" --limit 30 \
              --json databaseId,conclusion \
              --jq '[.[] | select(.conclusion == "success") | .databaseId][0] // empty')"
            if [ -n "$RUN_ID" ]; then break; fi
            sleep 10
          done
          if [ -z "$RUN_ID" ]; then
            echo "No successful APK build for commit $GITHUB_SHA"
            exit 1
          fi
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"

      - name: Retrieve signed APK artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run download "${{ steps.signed.outputs.run_id }}" --repo "$GITHUB_REPOSITORY" \
            --name FRIDAY-release-signed-apk --dir dist
          test -s dist/app-release.apk
          unzip -tq dist/app-release.apk
          mv dist/app-release.apk dist/FRIDAY-v3.8.7-release.apk
          sha256sum dist/FRIDAY-v3.8.7-release.apk

      - name: Create exact version tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if ! gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v3.8.7" >/dev/null 2>&1; then
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
              -f ref='refs/tags/v3.8.7' -f sha="$GITHUB_SHA"
          fi

      - name: Publish signed Android release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view v3.8.7 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload v3.8.7 dist/FRIDAY-v3.8.7-release.apk \
              --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create v3.8.7 dist/FRIDAY-v3.8.7-release.apk \
              --repo "$GITHUB_REPOSITORY" --verify-tag \
              --title "F.R.I.D.A.Y. v3.8.7 - Actualités vocales sourcées" \
              --notes "FRIDAY v3.8.7 : correction des questions vocales sur les actualites des 7 dernieres heures. Fenetre temporelle exacte avec heure du telephone, demande de sources et dates de publication a Mistral Conversations web_search, relance ciblee unique si aucune URL ou reponse generique faussement hors ligne. En absence de sources exploitables, explication honnete sans inventer des nouvelles. Mode Web Toujours, commande STOP, anti-echo et Memory+ chiffree locale preserves. Essai reel sur appareil requis."
          fi
          gh release view v3.8.7 --repo "$GITHUB_REPOSITORY" --json url,assets
