plugins {
    id 'com.android.application'
    id 'com.chaquo.python'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'fr.friday.assistant'
    compileSdk 35
    defaultConfig {
        applicationId 'fr.friday.assistant'
        minSdk 26
        targetSdk 35
        versionCode 93
        versionName '3.13.8'
        ndk { abiFilters 'arm64-v8a' }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
    signingConfigs {
        release {
            def ks = System.getenv("KEYSTORE_PATH")
            if (ks != null && !ks.isEmpty()) {
                storeFile file(ks)
                storePassword System.getenv("KEYSTORE_PASSWORD")
                keyAlias System.getenv("KEY_ALIAS") ?: "friday"
                keyPassword System.getenv("KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        // Installe la v2.0 à côté de la v1.x, sans effacer ses clés ni son modèle Vosk.
        debug { applicationIdSuffix '.smartpreview' }
        release {
            minifyEnabled false
            if (System.getenv("KEYSTORE_PATH") != null) {
                signingConfig signingConfigs.release
            }
        }
    }
    packaging {
        jniLibs { useLegacyPackaging true }
    }
}

chaquopy {
    defaultConfig {
        version = '3.14'
        buildPython('python3.14')
    }
}

dependencies {
    // LLM exécuté sur le téléphone après import d'un modèle MediaPipe .task/.bin.
    // Aucun serveur OpenJarvis ni modèle intégré à l'APK.
    implementation 'com.google.mediapipe:tasks-genai:0.10.35'
    implementation 'com.google.ai.edge.litertlm:litertlm-android:0.19.1'
    implementation 'com.alphacephei:vosk-android:0.3.75'
    implementation 'androidx.core:core:1.13.1'
    implementation 'androidx.exifinterface:exifinterface:1.3.7'
}
